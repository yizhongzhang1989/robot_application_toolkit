[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ros: requires a sourced ROS 2 environment", "controllers: requires local Nero/Piper simulation dependencies"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["third_party", ".runtime", "build", "install", "log"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# ROS imports deliberately follow pytest.importorskip when ROS is optional.
"tests/test_*ros*.py" = ["E402"]
