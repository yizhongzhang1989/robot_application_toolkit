name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt ./ros2/robot_application_toolkit
      - run: python -m ruff check . && python -m ruff format --check .
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q
      - run: python -m build ./ros2/robot_application_toolkit --outdir dist
  ros:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y python3-pytest python3-colcon-common-extensions libspnav-dev
          rosdep update
          rosdep install --from-paths ros2 third_party --ignore-src -r -y
      - name: Build and transport tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --base-paths ros2 third_party --packages-up-to robot_application_toolkit --cmake-args -DBUILD_TESTING=OFF
          source install/setup.bash
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest -q
